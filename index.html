<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Jump</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000000 !important;
            border: 2px solid #333333;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
        }

        /* Overlay UI Screens */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff2222;
            text-shadow: 0 0 10px rgba(255, 34, 34, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #aaaaaa;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000000;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #e0e0e0;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button.secondary {
            background: #444444;
            color: #ffffff;
        }

        button.secondary:hover {
            background: #555555;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Main Menu -->
        <div id="menu-screen" class="ui-screen">
            <h1>STICKMAN JUMP</h1>
            <p>Press <b>SPACE</b> or <b>CLICK</b> to jump!</p>
            <p id="menu-highscore" style="color: #00e676;">High Score: 0</p>
            <p id="menu-coins" style="color: #ffd700;">Total Coins: 0</p>
            <button id="start-btn" style="margin-top: 15px;">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="ui-screen hidden">
            <h2>GAME OVER</h2>
            <p id="final-score">Score: 0</p>
            <p id="high-score" style="color: #00e676;">High Score: 0</p>
            <p id="final-coins" style="color: #ffd700;">Total Coins: 0</p>
            <div class="btn-group">
                <button id="retry-btn">Try Again</button>
                <button id="menu-btn" class="secondary">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const menuScreen = document.getElementById('menu-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const menuHighscoreText = document.getElementById('menu-highscore');
        const menuCoinsText = document.getElementById('menu-coins');
        const finalScoreText = document.getElementById('final-score');
        const highScoreText = document.getElementById('high-score');
        const finalCoinsText = document.getElementById('final-coins');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const menuBtn = document.getElementById('menu-btn');

        // Game Constants
        const GROUND_Y = 320;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        
        // Colors
        const RED_OBSTACLE = '#ff2222';
        const GOLD_COIN = '#ffd700';
        const GRAY_GROUND = '#555555';
        const WHITE_STICKMAN = '#ffffff';

        // Saved Data (Loaded from LocalStorage)
        let totalCoins = parseInt(localStorage.getItem('stickman_coins')) || 0;
        let highScore = parseInt(localStorage.getItem('stickman_highscore')) || 0;

        // Game State Variables
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let coins = [];
        let spawnTimer = 0;
        let coinSpawnTimer = 0;
        let nextSpawnInterval = 100;
        let nextCoinInterval = 120;

        // Save progress function
        function saveGameData() {
            localStorage.setItem('stickman_coins', totalCoins);
            localStorage.setItem('stickman_highscore', highScore);
        }

        // Player (Stickman) State
        const player = {
            x: 80,
            y: GROUND_Y,
            vy: 0,
            radius: 12,
            height: 50,
            isGrounded: true,

            reset() {
                this.y = GROUND_Y;
                this.vy = 0;
                this.isGrounded = true;
            },

            jump() {
                if (this.isGrounded) {
                    this.vy = JUMP_FORCE;
                    this.isGrounded = false;
                }
            },

            update() {
                this.vy += GRAVITY;
                this.y += this.vy;

                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            },

            draw() {
                const headY = this.y - this.height;

                ctx.strokeStyle = WHITE_STICKMAN;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                // Head
                ctx.beginPath();
                ctx.arc(this.x, headY, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Body
                ctx.beginPath();
                ctx.moveTo(this.x, headY + this.radius);
                ctx.lineTo(this.x, this.y - 15);
                ctx.stroke();

                // Legs
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x - 10, this.y);
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x + 10, this.y);
                ctx.stroke();

                // Arms
                ctx.beginPath();
                const armY = headY + this.radius + 10;
                if (!this.isGrounded) {
                    ctx.moveTo(this.x - 12, armY - 8);
                    ctx.lineTo(this.x, armY);
                    ctx.lineTo(this.x + 12, armY - 8);
                } else {
                    ctx.moveTo(this.x - 10, armY + 5);
                    ctx.lineTo(this.x, armY);
                    ctx.lineTo(this.x + 10, armY + 5);
                }
                ctx.stroke();
            }
        };

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') player.jump();
            }
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'PLAYING') player.jump();
        });

        // UI Event Listeners
        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', showMainMenu);

        // Core Game Functions
        function showMainMenu() {
            gameState = 'MENU';
            menuHighscoreText.textContent = `High Score: ${highScore}`;
            menuCoinsText.textContent = `Total Coins: ${totalCoins}`;
            menuScreen.classList.remove('hidden');
            gameoverScreen.classList.add('hidden');
            resetGameValues();
            renderBackgroundOnly();
        }

        function startGame() {
            gameState = 'PLAYING';
            resetGameValues();
            menuScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const currentScore = Math.floor(score);

            // Check and update high score
            if (currentScore > highScore) {
                highScore = currentScore;
            }

            // Save persistent data
            saveGameData();

            finalScoreText.textContent = `Score: ${currentScore}`;
            highScoreText.textContent = `High Score: ${highScore}`;
            finalCoinsText.textContent = `Total Coins: ${totalCoins}`;
            gameoverScreen.classList.remove('hidden');
        }

        function resetGameValues() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            coins = [];
            spawnTimer = 0;
            coinSpawnTimer = 0;
            nextSpawnInterval = 80;
            nextCoinInterval = 100;
            player.reset();
        }

        function spawnObstacle() {
            const allowFlying = score >= 200;
            const isFlying = allowFlying && Math.random() < 0.35;

            if (isFlying) {
                const width = Math.floor(Math.random() * 30 + 35);
                const height = 25;
                const y = GROUND_Y - 95;

                obstacles.push({ x: canvas.width, y, width, height });
            } else {
                const width = Math.floor(Math.random() * 55 + 20);
                const height = Math.floor(Math.random() * 45 + 25);

                obstacles.push({
                    x: canvas.width,
                    y: GROUND_Y - height,
                    width,
                    height
                });
            }
        }

        function spawnCoin() {
            const isAirCoin = Math.random() < 0.6; 
            const y = isAirCoin ? GROUND_Y - Math.floor(Math.random() * 60 + 60) : GROUND_Y - 20;

            coins.push({
                x: canvas.width,
                y: y,
                radius: 10
            });
        }

        function checkCollision(player, obs) {
            const playerLeft = player.x - 10;
            const playerRight = player.x + 10;
            const playerTop = player.y - player.height - player.radius;
            const playerBottom = player.y;

            return (
                playerRight > obs.x &&
                playerLeft < obs.x + obs.width &&
                playerBottom > obs.y &&
                playerTop < obs.y + obs.height
            );
        }

        function checkCoinCollection(player, coin) {
            const playerLeft = player.x - 10;
            const playerRight = player.x + 10;
            const playerTop = player.y - player.height - player.radius;
            const playerBottom = player.y;

            const coinLeft = coin.x - coin.radius;
            const coinRight = coin.x + coin.radius;
            const coinTop = coin.y - coin.radius;
            const coinBottom = coin.y + coin.radius;

            return (
                playerRight > coinLeft &&
                playerLeft < coinRight &&
                playerBottom > coinTop &&
                playerTop < coinBottom
            );
        }

        function drawEnvironment() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = GRAY_GROUND;
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            ctx.strokeStyle = '#777777';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();
        }

        // Main Game Loop
        function gameLoop() {
            drawEnvironment();

            if (gameState === 'PLAYING') {
                gameSpeed += 0.0015;
                score += gameSpeed * 0.05;

                player.update();
                player.draw();

                // --- Handle Obstacles ---
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    spawnObstacle();
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 50 + 600 / gameSpeed);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= gameSpeed;

                    ctx.fillStyle = RED_OBSTACLE;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    if (checkCollision(player, obs)) {
                        triggerGameOver();
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                // --- Handle Coins ---
                coinSpawnTimer++;
                if (coinSpawnTimer >= nextCoinInterval) {
                    spawnCoin();
                    coinSpawnTimer = 0;
                    nextCoinInterval = Math.floor(Math.random() * 80 + 100);
                }

                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    coin.x -= gameSpeed;

                    ctx.fillStyle = GOLD_COIN;
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    if (checkCoinCollection(player, coin)) {
                        totalCoins += 1; // Increase total coin wallet
                        saveGameData(); // Save instantly
                        coins.splice(i, 1);
                        continue;
                    }

                    if (coin.x + coin.radius < 0) {
                        coins.splice(i, 1);
                    }
                }

                // Render HUD
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(`Score: ${Math.floor(score)}`, 20, 35);
                
                ctx.fillStyle = '#00e676';
                ctx.fillText(`High: ${highScore}`, 150, 35);

                ctx.fillStyle = '#ffd700';
                ctx.fillText(`Coins: ${totalCoins}`, 270, 35);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Speed: ${gameSpeed.toFixed(1)}x`, 680, 35);
            }

            requestAnimationFrame(gameLoop);
        }

        function renderBackgroundOnly() {
            drawEnvironment();
            player.draw();
        }

        // Initialize display
        showMainMenu();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
