<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Jump</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #FFF;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p.subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #DDD;
        }
        .score-display {
            font-size: 24px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background-color: #57606f;
        }
        .btn-secondary:hover {
            background-color: #747d8c;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">Score: <span id="score">0</span></div>
    
    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
        <h1>STICKMAN JUMP</h1>
        <p class="subtitle">Press Space or Tap to Jump</p>
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-menu" class="overlay hidden">
        <h1>GAME OVER</h1>
        <div class="score-display">Final Score: <span id="final-score">0</span></div>
        <div>
            <button id="retry-btn">Try Again</button>
            <button id="menu-btn" class="btn-secondary">Main Menu</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI Elements
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('final-score');

const startBtn = document.getElementById('start-btn');
const retryBtn = document.getElementById('retry-btn');
const menuBtn = document.getElementById('menu-btn');

// Game Constants
const GROUND_Y = 320;
const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const INITIAL_SPEED = 6;
const MAX_SPEED = 16;
const SPEED_ACCELERATION = 0.0015;

// State Variables
let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
let score = 0;
let gameSpeed = INITIAL_SPEED;
let animationFrameId;
let runFrame = 0;

// Player Setup
const player = {
    x: 100,
    y: GROUND_Y,
    velocityY: 0,
    isGrounded: true,
    height: 60,
    width: 20,
    
    reset() {
        this.y = GROUND_Y;
        this.velocityY = 0;
        this.isGrounded = true;
    },
    
    jump() {
        if (this.isGrounded) {
            this.velocityY = JUMP_FORCE;
            this.isGrounded = false;
        }
    },
    
    update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;

        if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.velocityY = 0;
            this.isGrounded = true;
        }
    },
    
    draw() {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        const headRadius = 10;
        const headY = this.y - this.height + headRadius;
        const torsoTopY = headY + headRadius;
        const torsoBottomY = this.y - 25;

        // Head
        ctx.beginPath();
        ctx.arc(this.x, headY, headRadius, 0, Math.PI * 2);
        ctx.stroke();

        // Torso
        ctx.beginPath();
        ctx.moveTo(this.x, torsoTopY);
        ctx.lineTo(this.x, torsoBottomY);
        ctx.stroke();

        // Animated Legs & Arms
        if (!this.isGrounded) {
            // Jump pose
            ctx.beginPath();
            ctx.moveTo(this.x, torsoBottomY);
            ctx.lineTo(this.x - 12, this.y - 10);
            ctx.moveTo(this.x, torsoBottomY);
            ctx.lineTo(this.x + 12, this.y - 15);
            // Arms UP
            ctx.moveTo(this.x, torsoTopY + 5);
            ctx.lineTo(this.x - 10, torsoTopY - 10);
            ctx.moveTo(this.x, torsoTopY + 5);
            ctx.lineTo(this.x + 10, torsoTopY - 10);
            ctx.stroke();
        } else {
            // Running leg positions based on runFrame
            const legAngle = Math.sin(runFrame * 0.2) * 15;
            ctx.beginPath();
            // Left leg
            ctx.moveTo(this.x, torsoBottomY);
            ctx.lineTo(this.x - legAngle, this.y);
            // Right leg
            ctx.moveTo(this.x, torsoBottomY);
            ctx.lineTo(this.x + legAngle, this.y);
            
            // Arms swinging
            ctx.moveTo(this.x, torsoTopY + 5);
            ctx.lineTo(this.x + legAngle * 0.8, torsoTopY + 20);
            ctx.moveTo(this.x, torsoTopY + 5);
            ctx.lineTo(this.x - legAngle * 0.8, torsoTopY + 20);
            ctx.stroke();
        }
    }
};

// Obstacles Setup
let obstacles = [];
const OBSTACLE_TYPES = [
    { name: 'small', width: 20, height: 30, color: '#e74c3c' },
    { name: 'medium', width: 35, height: 50, color: '#e67e22' },
    { name: 'big', width: 50, height: 70, color: '#8e44ad' }
];

let obstacleTimer = 0;
let minObstacleInterval = 70;

function spawnObstacle() {
    // Pick a random obstacle size profile
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    obstacles.push({
        x: canvas.width + 50,
        y: GROUND_Y - type.height,
        width: type.width,
        height: type.height,
        color: type.color
    });
}

function updateObstacles() {
    obstacleTimer++;
    // Adjust spawn frequency dynamically according to speed
    const currentInterval = Math.max(40, minObstacleInterval - Math.floor(gameSpeed));
    
    if (obstacleTimer > currentInterval + Math.random() * 40) {
        spawnObstacle();
        obstacleTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // Collision Check (AABB)
        const playerLeft = player.x - 10;
        const playerRight = player.x + 10;
        const playerTop = player.y - player.height;
        const playerBottom = player.y;

        if (
            playerRight > obs.x &&
            playerLeft < obs.x + obs.width &&
            playerBottom > obs.y &&
            playerTop < obs.y + obs.height
        ) {
            triggerGameOver();
        }

        // Cleanup offscreen obstacles
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function drawObstacles() {
    obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        // Dark inner border for style
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
    });
}

function drawEnvironment() {
    // Draw Ground
    ctx.fillStyle = '#2ed573';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    
    ctx.strokeStyle = '#26af5f';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();
}

// Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawEnvironment();

    if (gameState === 'PLAYING') {
        runFrame++;
        score += 0.1;
        scoreEl.innerText = Math.floor(score);

        // Gradually increase speed over time
        if (gameSpeed < MAX_SPEED) {
            gameSpeed += SPEED_ACCELERATION;
        }

        player.update();
        updateObstacles();
        
        player.draw();
        drawObstacles();

        animationFrameId = requestAnimationFrame(gameLoop);
    }
}

// Flow Control Functions
function startGame() {
    gameState = 'PLAYING';
    score = 0;
    gameSpeed = INITIAL_SPEED;
    obstacles = [];
    obstacleTimer = 0;
    player.reset();

    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    hud.classList.remove('hidden');

    cancelAnimationFrame(animationFrameId);
    gameLoop();
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    finalScoreEl.innerText = Math.floor(score);
    gameOverMenu.classList.remove('hidden');
    hud.classList.add('hidden');
}

function showMainMenu() {
    gameState = 'MENU';
    cancelAnimationFrame(animationFrameId);
    
    // Reset background scene render once
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawEnvironment();
    player.reset();
    player.draw();

    gameOverMenu.classList.add('hidden');
    hud.classList.add('hidden');
    mainMenu.classList.remove('hidden');
}

// Event Listeners
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState === 'PLAYING') {
            player.jump();
        } else if (gameState === 'MENU') {
            startGame();
        }
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') {
        player.jump();
    }
});

startBtn.addEventListener('click', startGame);
retryBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', showMainMenu);

// Initial Render on Page Load
showMainMenu();
</script>
</body>
</html>
