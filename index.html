<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Jump</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000000 !important;
            border: 2px solid #333333;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
        }

        /* Overlay UI Screens */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ff2222;
            text-shadow: 0 0 10px rgba(255, 34, 34, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #aaaaaa;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000000;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #e0e0e0;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button.secondary {
            background: #444444;
            color: #ffffff;
        }

        button.secondary:hover {
            background: #555555;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Main Menu -->
        <div id="menu-screen" class="ui-screen">
            <h1>STICKMAN JUMP</h1>
            <p>Press <b>SPACE</b> or <b>CLICK</b> to jump!</p>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="ui-screen hidden">
            <h2>GAME OVER</h2>
            <p id="final-score">Score: 0</p>
            <div class="btn-group">
                <button id="retry-btn">Try Again</button>
                <button id="menu-btn" class="secondary">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const menuScreen = document.getElementById('menu-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const finalScoreText = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const menuBtn = document.getElementById('menu-btn');

        // Game Constants
        const GROUND_Y = 320;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        
        // Colors
        const RED_OBSTACLE = '#ff2222';
        const GRAY_GROUND = '#555555';
        const WHITE_STICKMAN = '#ffffff';

        // Obstacle Size Configurations (Small, Medium, Big)
        const OBSTACLE_TYPES = [
            { name: 'small', width: 20, height: 30 },
            { name: 'medium', width: 30, height: 50 },
            { name: 'big', width: 45, height: 70 }
        ];

        // Game State Variables
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let spawnTimer = 0;
        let nextSpawnInterval = 100;

        // Player (Stickman) State
        const player = {
            x: 80,
            y: GROUND_Y,
            vy: 0,
            radius: 12, // Head radius
            height: 50, // Body length
            isGrounded: true,

            reset() {
                this.y = GROUND_Y;
                this.vy = 0;
                this.isGrounded = true;
            },

            jump() {
                if (this.isGrounded) {
                    this.vy = JUMP_FORCE;
                    this.isGrounded = false;
                }
            },

            update() {
                this.vy += GRAVITY;
                this.y += this.vy;

                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            },

            draw() {
                const headY = this.y - this.height;

                // White stickman styling
                ctx.strokeStyle = WHITE_STICKMAN;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                // Head
                ctx.beginPath();
                ctx.arc(this.x, headY, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Body
                ctx.beginPath();
                ctx.moveTo(this.x, headY + this.radius);
                ctx.lineTo(this.x, this.y - 15);
                ctx.stroke();

                // Legs
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x - 10, this.y); // Left leg
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x + 10, this.y); // Right leg
                ctx.stroke();

                // Arms
                ctx.beginPath();
                const armY = headY + this.radius + 10;
                if (!this.isGrounded) {
                    ctx.moveTo(this.x - 12, armY - 8);
                    ctx.lineTo(this.x, armY);
                    ctx.lineTo(this.x + 12, armY - 8);
                } else {
                    ctx.moveTo(this.x - 10, armY + 5);
                    ctx.lineTo(this.x, armY);
                    ctx.lineTo(this.x + 10, armY + 5);
                }
                ctx.stroke();
            }
        };

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') player.jump();
            }
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'PLAYING') player.jump();
        });

        // UI Event Listeners
        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', showMainMenu);

        // Core Game Functions
        function showMainMenu() {
            gameState = 'MENU';
            menuScreen.classList.remove('hidden');
            gameoverScreen.classList.add('hidden');
            resetGameValues();
            renderBackgroundOnly();
        }

        function startGame() {
            gameState = 'PLAYING';
            resetGameValues();
            menuScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            finalScoreText.textContent = `Score: ${Math.floor(score)}`;
            gameoverScreen.classList.remove('hidden');
        }

        function resetGameValues() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            spawnTimer = 0;
            nextSpawnInterval = 80;
            player.reset();
        }

        function spawnObstacle() {
            const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
            obstacles.push({
                x: canvas.width,
                y: GROUND_Y - type.height,
                width: type.width,
                height: type.height
            });
        }

        function checkCollision(player, obs) {
            const playerLeft = player.x - 10;
            const playerRight = player.x + 10;
            const playerTop = player.y - player.height - player.radius;
            const playerBottom = player.y;

            return (
                playerRight > obs.x &&
                playerLeft < obs.x + obs.width &&
                playerBottom > obs.y &&
                playerTop < obs.y + obs.height
            );
        }

        function drawEnvironment() {
            // Fill background with black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Gray Ground Block
            ctx.fillStyle = GRAY_GROUND;
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // Draw Gray Ground Top Edge Line for sharpness
            ctx.strokeStyle = '#777777';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();
        }

        // Main Game Loop
        function gameLoop() {
            drawEnvironment();

            if (gameState === 'PLAYING') {
                // Ramp up game speed over time
                gameSpeed += 0.0015;
                score += gameSpeed * 0.05;

                // Handle player update & render
                player.update();
                player.draw();

                // Handle Obstacles
                spawnTimer++;
                if (spawnTimer >= nextSpawnInterval) {
                    spawnObstacle();
                    spawnTimer = 0;
                    nextSpawnInterval = Math.floor(Math.random() * 50 + 600 / gameSpeed);
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= gameSpeed;

                    // Draw Red Obstacle
                    ctx.fillStyle = RED_OBSTACLE;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // Check Collision
                    if (checkCollision(player, obs)) {
                        triggerGameOver();
                    }

                    // Remove off-screen obstacles
                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                // Render Score UI
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`Score: ${Math.floor(score)}`, 20, 35);
                ctx.fillText(`Speed: ${gameSpeed.toFixed(1)}x`, 680, 35);
            }

            requestAnimationFrame(gameLoop);
        }

        function renderBackgroundOnly() {
            drawEnvironment();
            player.draw();
        }

        // Initialize display
        showMainMenu();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
